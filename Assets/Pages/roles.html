<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Role Selection</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            /* Düsterer Wald mit Vollmond als Hintergrund */
            background:
                    radial-gradient(circle at 50% 15%, rgba(255, 255, 255, 0.3) 0%, rgba(200, 220, 255, 0.15) 15%, transparent 30%),
                    radial-gradient(circle at 50% 15%, #e6f2ff 0%, #a3c2c2 8%, rgba(20, 30, 48, 0.8) 25%),
                    linear-gradient(to bottom, #0b1021 0%, #080c18 50%, #020307 100%);
            background-attachment: fixed;
            color: #e0e6ed;
        }

        /* Subtiler Nebel-Effekt über dem Hintergrund */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        h2 {
            font-size: 1.2rem;
            text-align: center;
            margin-bottom: 10px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            z-index: 1;
            letter-spacing: 0.5px;
        }

        /* Scrollbare Liste für die Rollen */
        .roles-list {
            width: 90%;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-right: 5px;
            z-index: 1;
        }

        /* Custom Scrollbar */
        .roles-list::-webkit-scrollbar {
            width: 6px;
        }
        .roles-list::-webkit-scrollbar-thumb {
            background: rgba(168, 35, 35, 0.5);
            border-radius: 4px;
        }

        /* Einzelne Rollen-Karte */
        .role-card {
            background: rgba(13, 19, 33, 0.75);
            border: 1.5px solid rgba(140, 30, 30, 0.4);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            transition: all 0.2s ease;
        }

        .role-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .role-icon {
            font-size: 1.6rem;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.2);
        }

        .role-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f0f4f8;
        }

        .checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: all 0.2s ease;
        }

        /* Ausgewählter Zustand */
        .role-card.selected {
            border-color: #a82323;
            background: rgba(45, 15, 20, 0.85);
            box-shadow: 0 0 12px rgba(168, 35, 35, 0.5);
        }

        .role-card.selected .checkbox {
            background: #a82323;
            border-color: #a82323;
            color: #fff;
        }

        /* Unterer Bestätigen-Button */
        .confirm-btn {
            width: 90%;
            margin-top: 15px;
            padding: 14px;
            background: rgba(168, 35, 35, 0.85);
            border: 1.5px solid #a82323;
            border-radius: 12px;
            color: #ffffff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(168, 35, 35, 0.4);
            z-index: 1;
            transition: all 0.2s ease;
        }

        .confirm-btn:active {
            transform: scale(0.98);
            background: #8c1e1e;
        }

        /* Das Overlay deckt den gesamten Bildschirm ab */
        #global-card-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;

            /* Leicht abgedunkelter Hintergrund */
            background-color: rgba(0, 0, 0, 0.6);

            /* Zentriert das Bild genau in der Bildschirmmitte */
            display: flex;
            justify-content: center;
            align-items: center;

            pointer-events: none; /* Klicks gehen durch, wenn unsichtbar */
            z-index: 99999; /* Über allem anderen */

            opacity: 0;
            transition: opacity 0.25s ease-in-out;
        }

        /* Das eigentliche Kartenbild im Vollbild */
        #global-card-overlay img {
            max-width: 80vw;   /* Maximal 80% der Bildschirmbreite */
            max-height: 80vh;  /* Maximal 80% der Bildschirmhöhe */
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);

            /* Animation beim Einblenden (leichtes Skalieren) */
            transform: scale(0.9);
            transition: transform 0.25s ease-in-out;
        }

        /* Zustand, wenn sichtbar */
        #global-card-overlay.visible {
            opacity: 1;
        }

        #global-card-overlay.visible img {
            transform: scale(1); /* Auf normale Größe zoomen */
        }
        
        .card-preview-btn {
            position: absolute;
            right: 3rem;
            background-color: #0b1021;
        }
    </style>
</head>
<body>

<h2>Выберите роли для игры:</h2>

<div class="roles-list" id="rolesList">
    <!-- Rollen-Liste wird dynamisch gerendert -->
</div>

<button class="confirm-btn" onclick="submitRoles()">Подтвердить</button>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Rollen-Daten mit Identifikatoren und passenden Emojis
    const rolesData = [
        { id: "werwolf1", dataId: "werwolf", title: "Оборотень 1", icon: "🐺", description: "Каждую ночь вместе со своей стаей просыпается, чтобы выбрать и растерзать новую жертву. Днем скрывается среди обычных жителей." },
        { id: "werwolf2", dataId: "werwolf", title: "Оборотень 2", icon: "🐺", description: "Каждую ночь вместе со своей стаей просыпается, чтобы выбрать и растерзать новую жертву. Днем скрывается среди обычных жителей." },
        { id: "werwolf3", dataId: "werwolf", title: "Оборотень 3", icon: "🐺", description: "Каждую ночь вместе со своей стаей просыпается, чтобы выбрать и растерзать новую жертву. Днем скрывается среди обычных жителей." },
        { id: "amo", dataId: "amo", title: "Амур", icon: "💘", description: "В первую ночь связывает судьбы двух игроков. Если погибает один из влюблённых, второй умирает от горя." },
        { id: "hexe", dataId: "hexe", title: "Ведьма", icon: "🧪", description: "Владеет двумя зельями: исцеления и яда. Может спасти жертву оборотней И отравить любого игрока по одному разу за игру." },
        { id: "jaeger", dataId: "jaeger", title: "Охотник", icon: "🏹", description: "Опытный стрелок. В момент своей смерти делает последний выстрел и забирает с собой любого выбранного игрока." },
        { id: "vanhelsing", dataId: "vanhelsing", title: "Ван Хельсинг", icon: "⚔️", description: "Каждую ночь может установить на игрока ловушку, которая сработает на следующую ночь. Если игрок, на которого установлена ловушка, подвергнется нападению на следующую ночь, погибнет случайный оборотень." },
        { id: "priester", dataId: "priester", title: "Священник", icon: "✝️", description: "Может один раз за игру облить игрока святой водой. Если этот игрок — оборотень, он погибает; если нет, погибает священник." },
        { id: "baerenfuehrer", dataId: "baerenfuehrer", title: "Укротитель Медведей", icon: "🐻", description: "Если рядом с ним сидит оборотень, его медведь начинает рычать в начале нового дня, предупреждая об опасности." },
        { id: "psyhopath", dataId: "psyhopath", title: "Психопат", icon: "🪓", description: "Обладает нестабильным разумом. Его цель — уйти из жизни в перый же день на голосовании. При успехе побеждает, А деревня проигрывает. Со второй ночи играет как Мирный житель."},
        { id: "wildekind", dataId: "wildekind", title: "Маугли", icon: "🐾", description: "В начале игры выбирает своего «кумира». Пока кумир жив, сражается на стороне жителей. Если кумир погибает, дитя превращается в полноценного оборотня." },
        { id: "detektiv", dataId: "detektiv", title: "Детектив", icon: "🔍", description: "Каждую ночь ведет расследование и может проверить Состоят ли два Выбранные им игрока в одной команде." },
        { id: "hure", dataId: "hure", title: "Блудница", icon: "💋", description: "Каждую ночь проводит у одного из жителей. Если она в гостях у мирного — оборотни не найдут её дома. Но если она зайдёт к оборотню или тот, у кого она осталась, будет убит — она погибает вместе с ним." },
        { id: "seherin", dataId: "seherin", title: "Гадалка", icon: "🔮", description: "Каждую ночь может узнать истинную сущность одного из игроков." },
        { id: "zwilling1", dataId: "zwilling", title: "Близнец 1", icon: "👥", description: "Две души, связанные воедино. Знают роли друг друга с самого начала игры." },
        { id: "zwilling2", dataId: "zwilling", title: "Близнец 2", icon: "👥", description: "Две души, связанные воедино. Знают роли друг друга с самого начала игры." },
        { id: "dorfbewohner1", dataId: "dorfbewohner", title: "Мирный 1", icon: "👨‍🌾", description: "Обычный житель деревни. Не обладает магией, но его главное оружие — голос и дедукция на дневном голосовании." },
        { id: "dorfbewohner2", dataId: "dorfbewohner", title: "Мирный 2", icon: "👩‍🌾", description: "Обычный житель деревни. Не обладает магией, но его главное оружие — голос и дедукция на дневном голосовании." }
    ];

    // Set zur Speicherung der ausgewählten Rollen
    const selectedRoles = new Set();

    const listContainer = document.getElementById('rolesList');

    // Rollen in das DOM einfügen
    rolesData.forEach(role => {
        const card = document.createElement('div');
        card.className = 'role-card';
        card.onclick = () => toggleRole(role.id, card);

        card.innerHTML = `
            <div class="role-info">
                <span class="role-icon">${role.icon}</span>
                <span class="role-title">${role.title}</span>
            </div>
            <button class="card-preview-btn" data-card-src="../Cards/ru/${role.dataId}.png">❓</button>
            <div class="checkbox" id="check-${role.id}"></div>
        `;
        
        listContainer.appendChild(card);
    });

    // Rolle aus-/abwählen
    function toggleRole(roleId, cardElement) {
        const checkElement = document.getElementById(`check-${roleId}`);

        if (selectedRoles.has(roleId)) {
            selectedRoles.delete(roleId);
            cardElement.classList.remove('selected');
            checkElement.innerText = '';
        } else {
            selectedRoles.add(roleId);
            cardElement.classList.add('selected');
            checkElement.innerText = '✓';
        }
    }

    // Auswahl an C#-Bot senden
    function submitRoles() {
        const roles = Array.from(selectedRoles);
        roles.forEach(r => r.replace(/\d/g, ''));
        
        const payload = {
            action: "confirmRoles",
            roles: roles
        };

        tg.sendData(JSON.stringify(payload));
    }

    document.addEventListener('DOMContentLoaded', () => {
        // 1. Erstelle das Overlay-Element einmalig im Body
        const overlay = document.createElement('div');
        overlay.id = 'global-card-overlay';
        const img = document.createElement('img');
        overlay.appendChild(img);
        document.body.appendChild(overlay);

        const rolesList = document.querySelector('.roles-list');

        // Hover starten: Bild setzen & Overlay anzeigen
        rolesList.addEventListener('mouseover', (e) => {
            const btn = e.target.closest('.card-preview-btn');
            if (!btn) return;

            const imgSrc = btn.getAttribute('data-card-src');
            if (!imgSrc) return;

            img.src = imgSrc;
            overlay.classList.add('visible');
        });

        // Hover beenden: Overlay verstecken
        rolesList.addEventListener('mouseout', (e) => {
            const btn = e.target.closest('.card-preview-btn');
            if (!btn) return;

            overlay.classList.remove('visible');
        });
    });
</script>
</body>
</html>
