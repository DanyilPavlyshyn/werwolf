<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mafia / Werewolf Choice</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Düsterer Wald mit Vollmond als Hintergrund */
            background:
                    radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.3) 0%, rgba(200, 220, 255, 0.15) 15%, transparent 30%),
                    radial-gradient(circle at 50% 20%, #e6f2ff 0%, #a3c2c2 8%, rgba(20, 30, 48, 0.8) 25%),
                    linear-gradient(to bottom, #0b1021 0%, #080c18 50%, #020307 100%);
            background-attachment: fixed;
            color: #e0e6ed;
        }

        /* Subtiler Nebel-Effekt über dem Hintergrund */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }

        /* Hauptcontainer: Nimmt ca. 80% der Höhe/Breite ein */
        .container {
            width: 85%;
            height: 80vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1;
        }

        /* Die zwei großen Auswahl-Karten */
        .choice-card {
            flex: 1;
            background: rgba(13, 19, 33, 0.75);
            border: 2px solid rgba(140, 30, 30, 0.5);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.7), inset 0 0 15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        /* Hover & Aktiver Zustand */
        .choice-card:hover, .choice-card:active {
            transform: scale(1.02);
            border-color: #a82323;
            background: rgba(25, 33, 52, 0.85);
            box-shadow: 0 0 20px rgba(168, 35, 35, 0.6), inset 0 0 20px rgba(168, 35, 35, 0.3);
        }

        .icon {
            font-size: 3rem;
            margin-bottom: 12px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #f0f4f8;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            letter-spacing: 0.5px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: #9ab0c7;
            margin-top: 6px;
        }

        /* Spezieller roter Akzent für die Host-Rolle */
        .host-card {
            border-color: rgba(168, 35, 35, 0.6);
        }

        /* Spezieller bläulicher Akzent für die Spieler-Rolle */
        .player-card {
            border-color: rgba(45, 90, 140, 0.6);
        }

        .player-card:hover, .player-card:active {
            border-color: #3b82f6;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5), inset 0 0 20px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Option 1: Spiel erstellen (Spielleiter) -->
    <div class="choice-card host-card" onclick="selectRole('create_game')">
        <div class="icon">🐺</div>
        <div class="title">Создать игру</div>
        <div class="subtitle">(быть ведущим)</div>
    </div>

    <!-- Option 2: Beitreten (Spieler) -->
    <div class="choice-card player-card" onclick="selectRole('join_game')">
        <div class="icon">📜</div>
        <div class="title">Присоединиться</div>
        <div class="subtitle">(играть)</div>
    </div>
</div>

<script>
    // Telegram WebApp SDK initialisieren
    const tg = window.Telegram.WebApp;
    tg.expand(); // Auf volle Höhe erweitern

    function selectRole(role) {
        // Sendet die gewählte Option als JSON an den C#-Bot zurück
        const data = {
            action: role
        };

        tg.sendData(JSON.stringify(data));
    }
</script>
</body>
</html>
